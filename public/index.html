
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Analytics 4 - SciScribe Solutions -->
    <!-- Firebase Analytics handles tracking -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Professional Scientific Writing Services - High-quality research paper writing, editing, and publication support" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SciScribe" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>SciScribe Solutions - Professional Scientific Writing Services</title>
  </head>
  <body>
    <!-- A little help for the Netlify post-processing bots -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="file" name="file" />
      <textarea name="message"></textarea>
    </form>
    
    <!-- Contact Full form -->
    <form name="contact-full" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="service" />
      <input type="checkbox" name="addon-plagiarism" />
      <input type="checkbox" name="addon-statistical" />
      <input type="checkbox" name="addon-figures" />
      <input type="checkbox" name="addon-journal" />
      <input type="checkbox" name="addon-cover" />
      <input type="checkbox" name="addon-fastTrack" />
      <input type="file" name="fileUpload" />
      <input type="date" name="deadline" />
      <input type="radio" name="contactMethod" value="email" />
      <input type="radio" name="contactMethod" value="phone" />
      <input type="radio" name="contactMethod" value="whatsapp" />
      <input type="text" name="source" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="gdprConsent1" />
      <input type="checkbox" name="gdprConsent2" />
    </form>
    
    <!-- Feedback form -->
    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="service" />
      <input type="number" name="rating" />
      <textarea name="feedbackText"></textarea>
    </form>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
